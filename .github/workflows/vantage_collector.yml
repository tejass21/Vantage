name: 24x7 Vantage Tick Collector

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

permissions:
  contents: write

jobs:
  collect-ticks:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tick Collector (3.8 Hours Session)
        run: |
          python collector.py --duration-hours 3.8

      - name: Commit and Push New Ticks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/USDJPY_ticks.csv
          if git diff --staged --quiet; then
            echo "No new ticks to commit."
          else
            git commit -m "Auto-collected Vantage ticks update [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
